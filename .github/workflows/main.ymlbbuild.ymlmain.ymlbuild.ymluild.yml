name: Build Gmu for RG52MINI (AArch64 TTF + EQ)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gmu source
        uses: actions/checkout@v4
        with:
          repository: jhe2/gmu
          path: gmu-src

      - name: Checkout our patches
        uses: actions/checkout@v4
        with:
          path: our-patches

      - name: Apply EQ patches (audio.h + audio.c)
        run: |
          cp our-patches/patches/audio.h gmu-src/src/audio.h
          cp our-patches/patches/audio.c gmu-src/src/audio.c
          echo "EQ patches applied"

      - name: Patch sdl.c to init EQ
        run: |
          cd gmu-src
          sed -i '/#include "wejconfig.h"/a #include "../../audio.h"' src/frontends/sdl/sdl.c
          sed -i '/cfg_add_key_if_not_present(config, "SDL.DefaultSkin", "default-modern");/a \\n\tcfg_add_key_if_not_present(config, "EQ.Enabled", "yes");\n\tcfg_add_key_if_not_present(config, "EQ.Band0", "0.0");\n\tcfg_add_key_if_not_present(config, "EQ.Band1", "0.0");\n\tcfg_add_key_if_not_present(config, "EQ.Band2", "0.0");\n\tcfg_add_key_if_not_present(config, "EQ.Band3", "0.0");\n\tcfg_add_key_if_not_present(config, "EQ.Band4", "0.0");' src/frontends/sdl/sdl.c
          sed -i '/if (skinname) strncpy(skin_name, skinname, 127);/a \\n\t\t{\n\t\t\tconst char *eq_en = cfg_get_key_value(config, "EQ.Enabled");\n\t\t\tif (eq_en \&\& strcmp(eq_en, "yes") == 0) {\n\t\t\t\taudio_eq_set_enabled(1);\n\t\t\t\tint bi; for (bi = 0; bi < 5; bi++) {\n\t\t\t\t\tchar key[32]; snprintf(key, 31, "EQ.Band%d", bi);\n\t\t\t\t\tconst char *val = cfg_get_key_value(config, key);\n\t\t\t\t\tif (val) audio_eq_set_band(bi, (float)atof(val));\n\t\t\t\t}\n\t\t\t}\n\t\t}' src/frontends/sdl/sdl.c
          echo "sdl.c patched"
          grep -c "audio_eq" src/frontends/sdl/sdl.c

      - name: Install AArch64 cross-compiler
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config

      - name: Install SDL2 dev libraries (arm64)
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64

      - name: Configure Gmu
        run: |
          cd gmu-src
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          ./configure --target-device=unknown

      - name: Build Gmu
        run: |
          cd gmu-src
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          make -j$(nproc)
          ls -lh gmu.bin frontends/sdl.so
          file gmu.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmu-rg52mini-aarch64-ttf-eq
          path: |
            gmu-src/gmu.bin
            gmu-src/frontends/sdl.so
            gmu-src/decoders/*.so
            


